pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  # Do not log query strings, request bodies or Authorization headers.
  log_format safe '$remote_addr $host $request_method $uri $status';
  access_log /dev/stdout safe;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 8m;
  limit_req_zone $server_name zone=ingest:1m rate=100r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Resolve again after backend containers are recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080 default_server;
    server_name _;
    location = /healthz {
      access_log off;
      set $grafana_health http://grafana:3000/api/health;
      proxy_set_header Host @@GRAFANA_HOST@@;
      proxy_pass $grafana_health;
    }
    location / { return 404; }
  }
  server {
    listen 8080;
    server_name @@GRAFANA_HOST@@;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location / {
      set $grafana http://grafana:3000;
      proxy_pass $grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
  server {
    listen 8080;
    server_name @@OTLP_HOST@@;
    location ~ ^/v1/(traces|logs|metrics)$ {
      limit_except POST { deny all; }
      limit_req zone=ingest burst=200 nodelay;
      limit_req_status 429;
      set $alloy http://alloy:4318;
      proxy_pass $alloy;
      proxy_read_timeout 30s;
    }
    location / { return 404; }
  }
  # Grafana Viewers can call the data-source proxy with arbitrary paths.
  # Some backend admin actions accept GET, so a method filter alone is unsafe.
  # This listener is Docker-internal and is not published on the EC2 host.
  server {
    listen 8081;
    server_name _;
    location ~ ^/prometheus/api/v1/(query|query_range|query_exemplars|series|labels|label/[^/]+/values)$ {
      limit_except GET POST { deny all; }
      set $prometheus_query http://prometheus:9090;
      rewrite ^/prometheus(/.*)$ $1 break;
      proxy_pass $prometheus_query;
    }
    location ~ ^/prometheus/api/v1/(metadata|status/buildinfo|status/config|rules|alerts|targets|targets/metadata)$ {
      limit_except GET { deny all; }
      set $prometheus_info http://prometheus:9090;
      rewrite ^/prometheus(/.*)$ $1 break;
      proxy_pass $prometheus_info;
    }
    location ~ ^/loki/loki/api/v1/(query|query_range)$ {
      limit_except GET POST { deny all; }
      set $loki_query http://loki:3100;
      rewrite ^/loki(/.*)$ $1 break;
      proxy_pass $loki_query;
    }
    location ~ ^/loki/loki/api/v1/(labels|label/[^/]+/values|series|index/stats|index/volume|index/volume_range|patterns|tail|status/buildinfo|format_query|detected_fields|detected_labels|detected_field/[^/]+/values)$ {
      limit_except GET { deny all; }
      set $loki_info http://loki:3100;
      rewrite ^/loki(/.*)$ $1 break;
      proxy_pass $loki_info;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location ~ ^/tempo/api/(echo|search|search/tags|search/tag/[^/]+/values|traces/[a-fA-F0-9]+|v2/traces/[a-fA-F0-9]+|v2/search/tags|v2/search/tag/[^/]+/values|metrics/query|metrics/query_range|status/buildinfo)$ {
      limit_except GET { deny all; }
      set $tempo_query http://tempo:3200;
      rewrite ^/tempo(/.*)$ $1 break;
      proxy_pass $tempo_query;
    }
    location / { return 404; }
  }
}
