server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: s3
    wal:
      path: /var/lib/tempo/wal
    s3:
      bucket: @@TRACES_BUCKET@@
      region: @@REGION@@
      endpoint: s3.@@REGION@@.amazonaws.com
usage_report:
  reporting_enabled: false
