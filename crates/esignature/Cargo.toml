[package]
name = "esignature"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
inbound = ["dep:axum", "dep:macro_authorization", "dep:base64"]
postgres = ["dep:sqlx"]
pdf = ["dep:lopdf", "dep:ttf-parser"]
mail = ["dep:ses_client", "dep:html-escape"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v7"] }
sha2 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
email_validator = { path = "../email_validator" }
axum = { workspace = true, optional = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"], optional = true }
base64 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
lopdf = { version = "0.39", optional = true }
ttf-parser = { version = "0.25", optional = true }
ses_client = { path = "../ses_client", optional = true }
html-escape = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tower = { workspace = true }
rootcause = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
