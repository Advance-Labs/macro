[package]
name = "agent_review_runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
diffd-core = { path = "../../vendor/diffd-core" }
rayon = "1.11"
sha2 = "0.10"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
